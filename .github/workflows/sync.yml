name: Sincroniza con PLACSP y BDNS

# Descarga cada día los contratos (Plataforma de Contratación del Sector Público)
# y las subvenciones (BDNS) del órgano configurado en config/entidad.json,
# fusiona con los registros manuales, valida, guarda los cambios y publica.
on:
  schedule:
    - cron: "17 5 * * *"   # todos los días a las 05:17 UTC
  workflow_dispatch:         # también se puede lanzar desde el editor o desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de los conectores
        run: node --test tests/*.test.mjs
      - name: Sincroniza fuentes oficiales
        run: node scripts/sync/run.mjs
      - name: Valida y regenera catálogo
        run: node scripts/build-catalog.mjs
      - name: Guarda los cambios
        run: |
          git config user.name "sincronizacion-portal[bot]"
          git config user.email "sincronizacion-portal@users.noreply.github.com"
          git add data/ datapackage.json api/ feed.xml sitemap.xml
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Sincronización automática con PLACSP y BDNS ($(date -u +%F))" && git push; fi

  publish:
    needs: sync
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
