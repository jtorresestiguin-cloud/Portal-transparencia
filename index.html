<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Transparencia</title>
  <meta name="description" content="Toda la información pública, clara y accesible: presupuesto, contratos, subvenciones, cargos públicos, personal, patrimonio y derecho de acceso.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="Novedades" href="feed.xml">
  <link rel="alternate" type="application/ld+json" title="Catálogo DCAT-AP" href="data/catalog.jsonld">
  <link rel="alternate" type="application/rdf+xml" title="Catálogo DCAT-AP-ES" href="data/catalog.rdf">
  <link rel="describedby" href="api/openapi.json" type="application/json">
  <link rel="stylesheet" href="assets/css/portal.css">
  <script>try { var th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}</script>
  <script type="module" src="assets/js/app.js"></script>
  <script>
    // Si el portal no llega a cargarse (fichero antiguo en caché, bloqueo de red…), se ofrece recargar en vez de dejar la página en blanco.
    setTimeout(function () {
      if (document.documentElement.dataset.app) return;
      var m = document.getElementById('main'); if (!m) return;
      m.removeAttribute('aria-busy');
      m.innerHTML = '<div class="container" style="padding:3rem 1rem;max-width:40rem"><h1>No se ha podido cargar el portal</h1><p>Puede deberse a una versión anterior guardada en el navegador. Recarga la página; si persiste, pulsa Ctrl+F5 (o Cmd+Shift+R en Mac).</p><p lang="en">The portal could not be loaded. Please reload the page.</p><p><button type="button" class="btn btn-primary" onclick="location.reload()">Recargar</button></p></div>';
    }, 8000);
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <div id="demo-banner" class="demo-banner" role="note" hidden></div>
    <div class="container header-bar">
      <a id="brand" class="brand" href="#/"></a>
      <div id="header-search" class="header-search"></div>
      <div class="header-tools">
        <a id="search-link" class="icon-btn icon-btn-lg search-link" href="#/buscar"></a>
        <div id="lang-switch" class="lang-switch"></div>
        <button type="button" id="theme-toggle" class="icon-btn icon-btn-lg">
          <svg class="icon theme-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon theme-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button type="button" id="menu-toggle" class="icon-btn icon-btn-lg menu-toggle" aria-expanded="false" aria-controls="menu-panel"></button>
      </div>
    </div>
    <nav id="mainnav" class="mainnav" aria-label="Principal"></nav>
    <div id="menu-panel" class="menu-panel" hidden></div>
  </header>
  <main id="main" tabindex="-1" aria-busy="true">
    <div class="container skeleton" aria-hidden="true"><div class="sk sk-title"></div><div class="sk sk-line"></div><div class="sk sk-search"></div><div class="sk-grid"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div></div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <noscript><p class="container">Este portal necesita JavaScript para mostrar las visualizaciones. Todos los datos están disponibles en <a href="data/catalog.jsonld">data/catalog.jsonld</a> y en la carpeta <a href="data/csv/">data/csv</a>.</p></noscript>
</body>
</html>
