<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Transparencia</title>
  <meta name="description" content="Portal de transparencia y datos abiertos: presupuesto, contratación, subvenciones, cargos públicos, personal, patrimonio y derecho de acceso.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="Novedades" href="feed.xml">
  <link rel="alternate" type="application/ld+json" title="Catálogo DCAT-AP" href="data/catalog.jsonld">
  <link rel="alternate" type="application/rdf+xml" title="Catálogo DCAT-AP-ES" href="data/catalog.rdf">
  <link rel="describedby" href="api/openapi.json" type="application/json">
  <link rel="stylesheet" href="assets/css/portal.css">
  <script>try { var th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}</script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div id="topbar" class="topbar"></div>
  <div id="demo-banner" class="demo-banner" role="note" hidden></div>
  <header class="site-header">
    <div class="container header-row">
      <a id="brand" class="brand" href="#/"></a>
      <div class="header-tools">
        <button type="button" id="search-open" class="tool-btn search-btn"></button>
        <button type="button" id="theme-toggle" class="tool-btn icon-only">
          <svg class="icon theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button type="button" id="nav-toggle" class="tool-btn nav-toggle" aria-expanded="false" aria-controls="mainnav"></button>
      </div>
    </div>
    <nav id="mainnav" class="mainnav" aria-label="Principal"></nav>
  </header>
  <main id="main" tabindex="-1"><div class="container loading" aria-hidden="true"><div class="spinner"></div></div></main>
  <footer id="site-footer" class="site-footer"></footer>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <noscript><p class="container">Este portal necesita JavaScript para mostrar las visualizaciones. Todos los datos están disponibles en <a href="data/catalog.jsonld">data/catalog.jsonld</a>.</p></noscript>
</body>
</html>
